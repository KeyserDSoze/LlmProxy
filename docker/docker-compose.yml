name: llmproxy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llmproxy}
      POSTGRES_USER: ${POSTGRES_USER:-llmproxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmproxy-dev}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmproxy} -d ${POSTGRES_DB:-llmproxy}"]
      interval: 5s
      timeout: 3s
      retries: 15

  llmproxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${LLMPROXY_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-llmproxy};Username=${POSTGRES_USER:-llmproxy};Password=${POSTGRES_PASSWORD:-llmproxy-dev}
      Authentication__ApiKey: ${LLM_PROXY_API_KEY:-dev-change-me}
      Authentication__ApiKeyPepper: ${LLM_PROXY_API_KEY_PEPPER:-development-pepper-change-me}
      Routing__Strategy: ${ROUTING_STRATEGY:-WeightedLeastLoaded}
      EntraId__Enabled: ${ENTRA_ENABLED:-false}
      EntraId__Instance: https://login.microsoftonline.com/
      EntraId__TenantId: ${ENTRA_TENANT_ID:-}
      EntraId__ClientId: ${ENTRA_CLIENT_ID:-}
      EntraId__ClientSecret: ${ENTRA_CLIENT_SECRET:-}
      EntraId__CallbackPath: /signin-oidc
      Bootstrap__Enabled: ${BOOTSTRAP_ENABLED:-true}
      Bootstrap__NodeName: ${DGX_NODE_NAME:-dgx-01}
      Bootstrap__NodeBaseAddress: ${DGX_NODE_BASE_ADDRESS:-http://host.docker.internal:8000}
      Bootstrap__NodeWeight: ${DGX_NODE_WEIGHT:-1}
      Bootstrap__NodeMaxConcurrency: ${DGX_NODE_MAX_CONCURRENCY:-4}
      Bootstrap__PublicModelName: ${PUBLIC_MODEL_NAME:-agic-code-fast}
      Bootstrap__ProviderModelName: ${PROVIDER_MODEL_NAME:-bootstrap-model}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
