name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate product version metadata
        shell: bash
        run: |
          VERSION="$(bash docker/scripts/validate-release-version.sh)"
          bash docker/scripts/validate-release-version.sh "$VERSION" >/dev/null
          if bash docker/scripts/validate-release-version.sh "0.0.0-ci-mismatch" >/dev/null 2>&1; then
            echo "Version validator accepted an intentionally mismatched release tag." >&2
            exit 1
          fi

      - name: Validate tagged-release source gate
        shell: bash
        run: |
          GOOD_SHA="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          cat > /tmp/validating-runs.json <<'JSON'
          {
            "workflow_runs": [
              {"id": 10, "name": "CI", "event": "push", "head_branch": "main", "head_sha": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "conclusion": "success"},
              {"id": 11, "name": "CI", "event": "push", "head_branch": "main", "head_sha": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "conclusion": "success"},
              {"id": 99, "name": "CI", "event": "pull_request", "head_branch": "main", "head_sha": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "conclusion": "success"}
            ]
          }
          JSON

          test "$(bash docker/scripts/validate-release-main-ci.sh "$GOOD_SHA" /tmp/validating-runs.json)" = "11"

          cat > /tmp/non-validating-runs.json <<'JSON'
          {
            "workflow_runs": [
              {"id": 20, "name": "CI", "event": "push", "head_branch": "feature", "head_sha": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "conclusion": "success"},
              {"id": 21, "name": "CI", "event": "push", "head_branch": "main", "head_sha": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "conclusion": "failure"},
              {"id": 22, "name": "CI", "event": "push", "head_branch": "main", "head_sha": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb", "conclusion": "success"}
            ]
          }
          JSON

          if bash docker/scripts/validate-release-main-ci.sh "$GOOD_SHA" /tmp/non-validating-runs.json >/dev/null 2>&1; then
            echo "Tagged-release source gate accepted workflow runs that do not validate the requested main SHA." >&2
            exit 1
          fi

          if bash docker/scripts/validate-release-main-ci.sh "not-a-sha" /tmp/validating-runs.json >/dev/null 2>&1; then
            echo "Tagged-release source gate accepted an invalid source SHA." >&2
            exit 1
          fi

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LlmProxy.slnx

      - name: Build
        run: dotnet build LlmProxy.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/backend/LlmProxy.UnitTests/LlmProxy.UnitTests.csproj -c Release --no-build --no-restore

      - name: Benchmark harness tests
        run: dotnet test tests/performance/LlmProxy.Benchmark.Tests/LlmProxy.Benchmark.Tests.csproj -c Release --no-build --no-restore

  frontend:
    name: Frontend unit and Playwright tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install admin dependencies
        working-directory: src/LlmProxy.Admin
        run: npm install --no-audit --no-fund

      - name: Build admin UI
        working-directory: src/LlmProxy.Admin
        run: npm run build

      - name: Install frontend test dependencies
        working-directory: tests/frontend
        run: npm install --no-audit --no-fund

      - name: Vitest
        working-directory: tests/frontend
        run: npm test

      - name: Install Playwright Chromium
        working-directory: tests/frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        working-directory: tests/frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Docker and PostgreSQL integration
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate quickstart Compose configuration
        env:
          POSTGRES_PASSWORD: ci-quickstart-postgres
          LLM_PROXY_API_KEY: ci-quickstart-api-key
          LLM_PROXY_API_KEY_PEPPER: ci-quickstart-pepper
        run: docker compose -f docker/docker-compose.quickstart.yml config >/dev/null

      - name: Validate full-stack Compose configuration
        env:
          POSTGRES_PASSWORD: ci-full-postgres
          REDIS_PASSWORD: ci-full-redis
          LLM_PROXY_API_KEY: ci-full-api-key
          LLM_PROXY_API_KEY_PEPPER: ci-full-pepper
          GRAFANA_ADMIN_PASSWORD: ci-full-grafana
        run: docker compose -f docker/docker-compose.full.yml config >/dev/null

      - name: Validate Linux production deployment path
        shell: bash
        run: |
          set -euo pipefail
          bash -n docker/scripts/deploy.sh
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          prepare_env() {
            local target="$1"
            sed \
              -e 's/CHANGE_ME_POSTGRES_PASSWORD/ci-postgres/' \
              -e 's/CHANGE_ME_REDIS_PASSWORD/ci-redis/' \
              -e 's/CHANGE_ME_LLM_PROXY_API_KEY/ci-api-key/' \
              -e 's/CHANGE_ME_LLM_PROXY_API_KEY_PEPPER/ci-pepper/' \
              -e 's/CHANGE_ME_GRAFANA_ADMIN_PASSWORD/ci-grafana/' \
              -e 's/CHANGE_ME_TO_VLLM_MODEL_NAME/ci-provider-model/' \
              docker/.env.production.example > "$target"
          }

          prepare_env "$TMP_DIR/private.env"
          LLMPROXY_DEPLOY_DIR="$TMP_DIR/private-runtime" \
          LLMPROXY_ENV_FILE="$TMP_DIR/private.env" \
          LLMPROXY_DEPLOY_VALIDATE_ONLY=true \
            bash docker/scripts/deploy.sh sha-ci-private
          test -f "$TMP_DIR/private-runtime/runtime/docker-compose.full.yml"
          test -f "$TMP_DIR/private-runtime/runtime/observability/otel-collector.yml"

          prepare_env "$TMP_DIR/public.env"
          sed -i \
            -e 's/^ENTRA_ENABLED=false$/ENTRA_ENABLED=true/' \
            -e 's/^ENTRA_TENANT_ID=$/ENTRA_TENANT_ID=ci-tenant/' \
            -e 's/^ENTRA_CLIENT_ID=$/ENTRA_CLIENT_ID=ci-client/' \
            -e 's/^ENTRA_CLIENT_SECRET=$/ENTRA_CLIENT_SECRET=ci-secret/' \
            -e 's/^CLOUDFLARE_TUNNEL_TOKEN=$/CLOUDFLARE_TUNNEL_TOKEN=ci-tunnel-token/' \
            "$TMP_DIR/public.env"
          LLMPROXY_DEPLOY_DIR="$TMP_DIR/public-runtime" \
          LLMPROXY_ENV_FILE="$TMP_DIR/public.env" \
          LLMPROXY_DEPLOY_VALIDATE_ONLY=true \
            bash docker/scripts/deploy.sh sha-ci-public

      - name: Validate production image build and identity
        shell: bash
        run: |
          VERSION="$(bash docker/scripts/validate-release-version.sh)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build -f docker/Dockerfile \
            --build-arg "LLMPROXY_VERSION=$VERSION" \
            --build-arg "LLMPROXY_BUILD_SHA=$GITHUB_SHA" \
            --build-arg "LLMPROXY_BUILD_DATE=$BUILD_DATE" \
            -t llmproxy:ci .

          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' llmproxy:ci)" = "$VERSION"
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' llmproxy:ci)" = "$GITHUB_SHA"
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.created" }}' llmproxy:ci)" = "$BUILD_DATE"
          docker image inspect -f '{{range .Config.Env}}{{println .}}{{end}}' llmproxy:ci | grep -Fx "LLMPROXY_BUILD_SHA=$GITHUB_SHA"
          docker image inspect -f '{{range .Config.Env}}{{println .}}{{end}}' llmproxy:ci | grep -Fx "LLMPROXY_BUILD_DATE=$BUILD_DATE"

      - name: Backend integration smoke suite
        run: bash tests/backend/integration/smoke.sh

      - name: DGX hardware telemetry smoke suite
        run: bash tests/backend/integration/hardware_smoke.sh

      - name: Capacity and backpressure smoke suite
        run: bash tests/backend/integration/capacity_smoke.sh

      - name: Usage governance and rate-limit smoke suite
        run: bash tests/backend/integration/governance_smoke.sh

      - name: Route catalog PostgreSQL outage smoke suite
        run: bash tests/backend/integration/route_catalog_smoke.sh

      - name: Data retention smoke suite
        run: bash tests/backend/integration/retention_smoke.sh

      - name: Backup and clean-target restore smoke suite
        run: bash tests/backend/integration/backup_restore_smoke.sh

      - name: PowerShell backup and restore smoke suite
        run: bash tests/backend/integration/backup_restore_powershell_smoke.sh
