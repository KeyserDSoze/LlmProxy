name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore LlmProxy.slnx

      - name: Build backend
        run: dotnet build LlmProxy.slnx -c Release --no-restore

      - name: Run backend tests
        run: dotnet test src/LlmProxy.Tests/LlmProxy.Tests.csproj -c Release --no-build --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install admin dependencies
        working-directory: src/LlmProxy.Admin
        run: npm install --no-audit --no-fund

      - name: Build admin UI
        working-directory: src/LlmProxy.Admin
        run: npm run build

      - name: Validate production image build
        run: docker build -f docker/Dockerfile -t llmproxy:ci .

      - name: Start Docker smoke stack
        run: docker compose -f docker/docker-compose.yml up -d --build

      - name: Smoke test gateway and database
        shell: bash
        run: |
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "Gateway did not become ready." >&2
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null
          curl --fail --silent \
            -H 'Authorization: Bearer dev-change-me' \
            http://127.0.0.1:8080/v1/models \
            | grep --quiet 'agic-code-fast'

      - name: Print Docker logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --no-color

      - name: Stop Docker smoke stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v --remove-orphans
