name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LlmProxy.slnx

      - name: Build
        run: dotnet build LlmProxy.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/backend/LlmProxy.UnitTests/LlmProxy.UnitTests.csproj -c Release --no-build --no-restore

      - name: Benchmark harness tests
        run: dotnet test tests/performance/LlmProxy.Benchmark.Tests/LlmProxy.Benchmark.Tests.csproj -c Release --no-build --no-restore

  frontend:
    name: Frontend unit and Playwright tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install admin dependencies
        working-directory: src/LlmProxy.Admin
        run: npm install --no-audit --no-fund

      - name: Build admin UI
        working-directory: src/LlmProxy.Admin
        run: npm run build

      - name: Install frontend test dependencies
        working-directory: tests/frontend
        run: npm install --no-audit --no-fund

      - name: Vitest
        working-directory: tests/frontend
        run: npm test

      - name: Install Playwright Chromium
        working-directory: tests/frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        working-directory: tests/frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Docker and PostgreSQL integration
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate quickstart Compose configuration
        env:
          POSTGRES_PASSWORD: ci-quickstart-postgres
          LLM_PROXY_API_KEY: ci-quickstart-api-key
          LLM_PROXY_API_KEY_PEPPER: ci-quickstart-pepper
        run: docker compose -f docker/docker-compose.quickstart.yml config >/dev/null

      - name: Validate production image build
        run: docker build -f docker/Dockerfile -t llmproxy:ci .

      - name: Backend integration smoke suite
        run: bash tests/backend/integration/smoke.sh

      - name: DGX hardware telemetry smoke suite
        run: bash tests/backend/integration/hardware_smoke.sh

      - name: Capacity and backpressure smoke suite
        run: bash tests/backend/integration/capacity_smoke.sh

      - name: Usage governance and rate-limit smoke suite
        run: bash tests/backend/integration/governance_smoke.sh

      - name: Route catalog PostgreSQL outage smoke suite
        run: bash tests/backend/integration/route_catalog_smoke.sh

      - name: Data retention smoke suite
        run: bash tests/backend/integration/retention_smoke.sh
