name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore LlmProxy.slnx

      - name: Build backend
        run: dotnet build LlmProxy.slnx -c Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install admin dependencies
        working-directory: src/LlmProxy.Admin
        run: npm install --no-audit --no-fund

      - name: Build admin UI
        working-directory: src/LlmProxy.Admin
        run: npm run build

      - name: Validate production image build
        run: docker build -f docker/Dockerfile -t llmproxy:ci .
