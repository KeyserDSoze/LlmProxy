name: Create immutable release tag

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  tag:
    name: Allocate immutable version and create tag
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.result.outputs.source_sha }}
      version: ${{ steps.result.outputs.version }}
      tag: ${{ steps.result.outputs.tag }}
      publish: ${{ steps.result.outputs.publish }}
    steps:
      - name: Checkout validated main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate triggering CI identity
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRIGGER_EVENT" == "push" ]] || {
            echo "Automatic releases are created only from CI push runs." >&2
            exit 2
          }
          [[ "$TRIGGER_BRANCH" == "main" ]] || {
            echo "Automatic releases are created only from main." >&2
            exit 2
          }

      - name: Confirm exact source CI through Actions API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGERING_CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          RUNS_FILE="$(mktemp)"
          trap 'rm -f "$RUNS_FILE"' EXIT

          curl --fail --silent --show-error             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&status=success&per_page=100"             > "$RUNS_FILE"

          CI_RUN_ID="$(bash docker/scripts/validate-release-main-ci.sh "$SOURCE_SHA" "$RUNS_FILE")"
          [[ "$CI_RUN_ID" == "$TRIGGERING_CI_RUN_ID" ]] || {
            echo "The successful source CI run ($CI_RUN_ID) does not match the triggering CI run ($TRIGGERING_CI_RUN_ID)." >&2
            exit 3
          }

      - name: Resolve existing or next immutable release tag
        id: result
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Commits before the automatic-release series marker are migration history,
          # not distribution releases. This makes the first eligible commit v0.0.1.
          if [[ ! -f distribution/AUTOMATIC_RELEASE_SERIES ]]; then
            {
              echo "source_sha=$SOURCE_SHA"
              echo "version="
              echo "tag="
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            echo "Source $SOURCE_SHA predates the automatic release series; skipping publication." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "Repository secret RELEASE_TOKEN is required for immutable tag creation." >&2
            echo "Use a fine-grained token with Contents: read/write and Workflows: read/write for this repository." >&2
            exit 6
          fi

          git fetch --tags --force origin

          EXISTING_TAG="$(
            git tag --points-at "$SOURCE_SHA"               | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'               | sort -V               | tail -n 1               || true
          )"

          if [[ -n "$EXISTING_TAG" ]]; then
            VERSION="${EXISTING_TAG#v}"
            if gh release view "$EXISTING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              PUBLISH=false
            else
              PUBLISH=true
            fi
            {
              echo "source_sha=$SOURCE_SHA"
              echo "version=$VERSION"
              echo "tag=$EXISTING_TAG"
              echo "publish=$PUBLISH"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MESSAGE="$(git log -1 --pretty=%B "$SOURCE_SHA")"
          BUMP=patch
          MARKERS=0
          if grep -Eiq '(^|[^a-z])release:major([^a-z]|$)' <<< "$MESSAGE"; then
            BUMP=major
            MARKERS=$((MARKERS + 1))
          fi
          if grep -Eiq '(^|[^a-z])release:minor([^a-z]|$)' <<< "$MESSAGE"; then
            BUMP=minor
            MARKERS=$((MARKERS + 1))
          fi
          if grep -Eiq '(^|[^a-z])release:patch([^a-z]|$)' <<< "$MESSAGE"; then
            BUMP=patch
            MARKERS=$((MARKERS + 1))
          fi
          if (( MARKERS > 1 )); then
            echo "Commit message contains more than one release bump marker." >&2
            exit 4
          fi

          CREATED=false
          for attempt in {1..20}; do
            git fetch --tags --force origin
            VERSION="$(bash docker/scripts/next-release-version.sh "$BUMP")"
            TAG="v$VERSION"

            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              sleep 1
              continue
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$SOURCE_SHA" -m "LlmProxy $VERSION"

            PUSH_URL="https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if git push "$PUSH_URL" "refs/tags/$TAG"; then
              CREATED=true
              break
            fi

            git tag -d "$TAG" >/dev/null 2>&1 || true
            sleep 1
          done

          [[ "$CREATED" == "true" ]] || {
            echo "Could not allocate a unique immutable release tag after 20 attempts." >&2
            exit 5
          }

          {
            echo "source_sha=$SOURCE_SHA"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Automatic immutable release"
            echo ""
            echo "- Source: `$SOURCE_SHA`"
            echo "- Bump: `$BUMP`"
            echo "- Version: `$VERSION`"
            echo "- Tag: `$TAG`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish immutable release
    needs: tag
    if: needs.tag.outputs.publish == 'true'
    uses: ./.github/workflows/container.yml
    with:
      source_sha: ${{ needs.tag.outputs.source_sha }}
      release_version: ${{ needs.tag.outputs.version }}
      release_tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
