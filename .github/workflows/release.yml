name: Create immutable release tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer from Directory.Build.props (without leading v)
        required: true
        type: string
      confirmation:
        description: Type RELEASE to create and push the immutable tag
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  tag:
    name: Validate main and create tag
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate requested release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "RELEASE" ]]; then
            echo "confirmation must be exactly RELEASE" >&2
            exit 2
          fi
          VERSION="$(bash docker/scripts/validate-release-version.sh "${{ inputs.version }}")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require green CI and Full stack on this exact main SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RUNS_FILE="$(mktemp)"
          trap 'rm -f "$RUNS_FILE"' EXIT
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100" \
            > "$RUNS_FILE"

          bash docker/scripts/validate-release-main-ci.sh "$SOURCE_SHA" "$RUNS_FILE" >/dev/null
          jq -e --arg sha "$SOURCE_SHA" '
            [.workflow_runs[]
             | select(.name == "Full stack smoke")
             | select(.event == "push")
             | select(.head_branch == "main")
             | select(.head_sha == $sha)
             | select(.conclusion == "success")]
            | length > 0
          ' "$RUNS_FILE" >/dev/null || {
            echo "No successful Full stack smoke push run validates main SHA $SOURCE_SHA." >&2
            exit 3
          }

      - name: Refuse an existing immutable tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Exact release tags are immutable." >&2
            exit 4
          fi

      - name: Setup QEMU for ARM64 preflight
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate ARM64 production image build before tagging
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --file docker/Dockerfile \
            --build-arg "LLMPROXY_VERSION=$VERSION" \
            --build-arg "LLMPROXY_BUILD_SHA=$GITHUB_SHA" \
            --build-arg "LLMPROXY_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --progress plain \
            .

      - name: Validate Linux release bundle before tagging
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          trap 'rm -rf "$OUT"' EXIT
          bash distribution/build-release-bundle.sh "$VERSION" "$OUT"
          (
            cd "$OUT"
            sha256sum -c "llmproxy-$VERSION-linux.tar.gz.sha256"
            sha256sum -c llmproxy-bootstrap.sh.sha256
          )

      - name: Create and push release tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "LlmProxy $VERSION"
          git push origin "$TAG"
          echo "Created $TAG. Publish container will build the multi-architecture image and GitHub Release assets." >> "$GITHUB_STEP_SUMMARY"
