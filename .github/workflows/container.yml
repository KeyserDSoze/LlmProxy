name: Publish container

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="$GITHUB_SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Validate version and resolve image metadata
        id: meta
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/llmproxy"
          EXPECTED_VERSION=""
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          fi

          VERSION="$(bash docker/scripts/validate-release-version.sh "$EXPECTED_VERSION")"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHA="${{ steps.source.outputs.sha }}"

          {
            echo "image=$IMAGE"
            echo "version=$VERSION"
            echo "build_date=$BUILD_DATE"
            echo "tags<<EOF"
          } >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"
            if [[ "$VERSION" != *-* ]]; then
              MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1-2)"
              echo "$IMAGE:$MAJOR_MINOR" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "$IMAGE:main" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "$IMAGE:sha-${SHA:0:7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push with SBOM and provenance
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
          build-args: |
            LLMPROXY_VERSION=${{ steps.meta.outputs.version }}
            LLMPROXY_BUILD_SHA=${{ steps.source.outputs.sha }}
            LLMPROXY_BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed digest, SBOM and provenance
        id: verify
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Build did not return a valid immutable image digest: '$DIGEST'." >&2
            exit 1
          }

          ROOT_INDEX="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw)"
          echo "$ROOT_INDEX" | jq -e '
            .mediaType == "application/vnd.oci.image.index.v1+json" and
            (.manifests | type == "array" and length > 0)
          ' >/dev/null || {
            echo "Published digest does not resolve to an OCI image index." >&2
            exit 1
          }

          mapfile -t IMAGE_MANIFEST_DIGESTS < <(
            echo "$ROOT_INDEX" | jq -r '
              .manifests[]
              | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
              | .digest
            '
          )
          mapfile -t ATTESTATION_DIGESTS < <(
            echo "$ROOT_INDEX" | jq -r '
              .manifests[]
              | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")
              | .digest
            '
          )

          if (( ${#IMAGE_MANIFEST_DIGESTS[@]} == 0 )); then
            echo "Published OCI index does not contain a runnable image manifest." >&2
            exit 1
          fi
          if (( ${#ATTESTATION_DIGESTS[@]} == 0 )); then
            echo "Published OCI index does not contain any attestation manifest." >&2
            exit 1
          fi

          FOUND_SBOM=false
          FOUND_PROVENANCE=false
          VERIFIED_ATTESTATIONS='[]'

          for ATTESTATION_DIGEST in "${ATTESTATION_DIGESTS[@]}"; do
            ATTESTATION_MANIFEST="$(docker buildx imagetools inspect "$IMAGE@$ATTESTATION_DIGEST" --raw)"

            echo "$ATTESTATION_MANIFEST" | jq -e '
              .mediaType == "application/vnd.oci.image.manifest.v1+json" and
              (.layers | type == "array" and length > 0) and
              ([.layers[] | select(.mediaType == "application/vnd.in-toto+json")] | length > 0)
            ' >/dev/null || {
              echo "Attestation descriptor $ATTESTATION_DIGEST is not a valid in-toto OCI attestation manifest." >&2
              exit 1
            }

            SUBJECT_DIGEST="$(echo "$ATTESTATION_MANIFEST" | jq -r '.subject.digest // empty')"
            if [[ -n "$SUBJECT_DIGEST" ]]; then
              MATCHED_SUBJECT=false
              for IMAGE_MANIFEST_DIGEST in "${IMAGE_MANIFEST_DIGESTS[@]}"; do
                if [[ "$SUBJECT_DIGEST" == "$IMAGE_MANIFEST_DIGEST" ]]; then
                  MATCHED_SUBJECT=true
                  break
                fi
              done
              if [[ "$MATCHED_SUBJECT" != true ]]; then
                echo "Attestation $ATTESTATION_DIGEST refers to unknown subject $SUBJECT_DIGEST." >&2
                exit 1
              fi
            fi

            while IFS= read -r PREDICATE_TYPE; do
              [[ -n "$PREDICATE_TYPE" ]] || continue

              if [[ "$PREDICATE_TYPE" == "https://spdx.dev/Document" ]]; then
                FOUND_SBOM=true
              elif [[ "$PREDICATE_TYPE" == https://slsa.dev/provenance/* ]]; then
                FOUND_PROVENANCE=true
              fi

              VERIFIED_ATTESTATIONS="$(
                jq -c \
                  --arg manifestDigest "$ATTESTATION_DIGEST" \
                  --arg predicateType "$PREDICATE_TYPE" \
                  '. + [{manifestDigest:$manifestDigest,predicateType:$predicateType}]' \
                  <<< "$VERIFIED_ATTESTATIONS"
              )"
            done < <(
              echo "$ATTESTATION_MANIFEST" | jq -r '
                .layers[]
                | select(.mediaType == "application/vnd.in-toto+json")
                | .annotations["in-toto.io/predicate-type"] // empty
              '
            )
          done

          if [[ "$FOUND_SBOM" != true ]]; then
            echo "Published image does not expose an SPDX SBOM OCI attestation." >&2
            exit 1
          fi
          if [[ "$FOUND_PROVENANCE" != true ]]; then
            echo "Published image does not expose an SLSA/BuildKit provenance OCI attestation." >&2
            exit 1
          fi

          jq -n \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg version "$VERSION" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg builtAtUtc "$BUILD_DATE" \
            --argjson attestations "$VERIFIED_ATTESTATIONS" \
            '{image:$image,digest:$digest,version:$version,sourceSha:$sourceSha,builtAtUtc:$builtAtUtc,sbom:"SPDX",provenance:"SLSA/BuildKit",attestations:$attestations}' \
            > release-manifest.json

          {
            echo "### LlmProxy container publication"
            echo ""
            echo "- Version: \`$VERSION\`"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- SBOM: SPDX OCI attestation verified"
            echo "- Provenance: SLSA/BuildKit OCI attestation verified"
            echo "- Attestation manifests: ${#ATTESTATION_DIGESTS[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: llmproxy-release-manifest-${{ steps.source.outputs.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30
