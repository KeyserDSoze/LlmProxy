name: Publish container

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="$GITHUB_SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Validate version and resolve image metadata
        id: meta
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/llmproxy"
          EXPECTED_VERSION=""
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          fi

          VERSION="$(bash docker/scripts/validate-release-version.sh "$EXPECTED_VERSION")"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHA="${{ steps.source.outputs.sha }}"

          {
            echo "image=$IMAGE"
            echo "version=$VERSION"
            echo "build_date=$BUILD_DATE"
            echo "tags<<EOF"
          } >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"
            if [[ "$VERSION" != *-* ]]; then
              MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1-2)"
              echo "$IMAGE:$MAJOR_MINOR" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "$IMAGE:main" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "$IMAGE:sha-${SHA:0:7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            LLMPROXY_VERSION=${{ steps.meta.outputs.version }}
            LLMPROXY_BUILD_SHA=${{ steps.source.outputs.sha }}
            LLMPROXY_BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
