name: Publish container

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact validated main commit SHA
        required: true
        type: string
      release_version:
        description: Immutable SemVer without leading v
        required: true
        type: string
      release_tag:
        description: Immutable Git tag
        required: true
        type: string

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Access to scoped deployment variables and secrets is deliberate: these
    # values are only passed to the encryption step, never Docker build.
    environment: test
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Validate release inputs
        id: meta
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid source SHA: $SOURCE_SHA" >&2
            exit 2
          }
          VERSION="$(bash docker/scripts/validate-release-version.sh "$REQUESTED_VERSION")"
          [[ "$RELEASE_TAG" == "v$VERSION" ]] || {
            echo "Release tag/version mismatch: $RELEASE_TAG != v$VERSION" >&2
            exit 2
          }

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/llmproxy"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1-2)"

          {
            echo "image=$IMAGE"
            echo "version=$VERSION"
            echo "build_date=$BUILD_DATE"
            echo "tags<<EOF"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:$MAJOR_MINOR"
            echo "$IMAGE:latest"
            echo "$IMAGE:main"
            echo "$IMAGE:sha-${SOURCE_SHA:0:7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify immutable tag points to source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          [[ "$TAG_SHA" == "$SOURCE_SHA" ]] || {
            echo "Tag $RELEASE_TAG points to $TAG_SHA, expected $SOURCE_SHA." >&2
            exit 3
          }

      - name: Validate publication source CI through Actions API
        id: validation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          RUNS_FILE="$(mktemp)"
          trap 'rm -f "$RUNS_FILE"' EXIT

          curl --fail --silent --show-error             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&status=success&per_page=100"             > "$RUNS_FILE"

          CI_RUN_ID="$(bash docker/scripts/validate-release-main-ci.sh "$SOURCE_SHA" "$RUNS_FILE")"
          echo "ci_run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; immutable releases are never overwritten." >&2
            exit 4
          fi

      - name: Verify protected test environment configuration and encrypt installer
        shell: bash
        env:
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_SUPER_ADMINS: ${{ vars.ENTRA_SUPER_ADMINS }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          INSTALL_PASSWORD: ${{ secrets.password }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Password/credentials are never echoed or written to release assets.
          bash distribution/build-environment-installer.sh test "$VERSION" dist
          (
            cd dist
            sha256sum -c test.sh.sha256
            sha256sum -c test.install.sh.gpg.sha256
          )

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Refuse an existing exact container tag
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Container tag $IMAGE:$VERSION already exists; immutable release tags are never overwritten." >&2
            exit 4
          fi

      - name: Build and push amd64 + arm64 with SBOM and provenance
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
          build-args: |
            LLMPROXY_VERSION=${{ steps.meta.outputs.version }}
            LLMPROXY_BUILD_SHA=${{ inputs.source_sha }}
            LLMPROXY_BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed digest, architectures, SBOM and provenance
        id: verify
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          VALIDATING_CI_RUN_ID: ${{ steps.validation.outputs.ci_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Build did not return a valid immutable image digest: '$DIGEST'." >&2
            exit 1
          }

          ROOT_INDEX="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw)"
          echo "$ROOT_INDEX" | jq -e '
            .mediaType == "application/vnd.oci.image.index.v1+json" and
            (.manifests | type == "array" and length > 0)
          ' >/dev/null

          for REQUIRED_ARCH in amd64 arm64; do
            echo "$ROOT_INDEX" | jq -e --arg arch "$REQUIRED_ARCH" '
              [.manifests[]
               | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
               | select(.platform.os == "linux" and .platform.architecture == $arch)]
              | length > 0
            ' >/dev/null || {
              echo "Published OCI index is missing linux/$REQUIRED_ARCH." >&2
              exit 1
            }
          done

          mapfile -t IMAGE_MANIFEST_DIGESTS < <(
            echo "$ROOT_INDEX" | jq -r '
              .manifests[]
              | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
              | .digest
            '
          )
          mapfile -t ATTESTATION_DIGESTS < <(
            echo "$ROOT_INDEX" | jq -r '
              .manifests[]
              | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")
              | .digest
            '
          )

          (( ${#IMAGE_MANIFEST_DIGESTS[@]} > 0 ))
          (( ${#ATTESTATION_DIGESTS[@]} > 0 ))

          FOUND_SBOM=false
          FOUND_PROVENANCE=false
          VERIFIED_ATTESTATIONS='[]'

          for ATTESTATION_DIGEST in "${ATTESTATION_DIGESTS[@]}"; do
            ATTESTATION_MANIFEST="$(docker buildx imagetools inspect "$IMAGE@$ATTESTATION_DIGEST" --raw)"
            echo "$ATTESTATION_MANIFEST" | jq -e '
              .mediaType == "application/vnd.oci.image.manifest.v1+json" and
              (.layers | type == "array" and length > 0) and
              ([.layers[] | select(.mediaType == "application/vnd.in-toto+json")] | length > 0)
            ' >/dev/null

            SUBJECT_DIGEST="$(echo "$ATTESTATION_MANIFEST" | jq -r '.subject.digest // empty')"
            if [[ -n "$SUBJECT_DIGEST" ]]; then
              MATCHED=false
              for IMAGE_MANIFEST_DIGEST in "${IMAGE_MANIFEST_DIGESTS[@]}"; do
                [[ "$SUBJECT_DIGEST" == "$IMAGE_MANIFEST_DIGEST" ]] && MATCHED=true
              done
              [[ "$MATCHED" == true ]] || {
                echo "Attestation refers to unknown subject $SUBJECT_DIGEST." >&2
                exit 1
              }
            fi

            while IFS= read -r PREDICATE_TYPE; do
              [[ -n "$PREDICATE_TYPE" ]] || continue
              [[ "$PREDICATE_TYPE" == "https://spdx.dev/Document" ]] && FOUND_SBOM=true
              [[ "$PREDICATE_TYPE" == https://slsa.dev/provenance/* ]] && FOUND_PROVENANCE=true
              VERIFIED_ATTESTATIONS="$(
                jq -c                   --arg manifestDigest "$ATTESTATION_DIGEST"                   --arg predicateType "$PREDICATE_TYPE"                   '. + [{manifestDigest:$manifestDigest,predicateType:$predicateType}]'                   <<< "$VERIFIED_ATTESTATIONS"
              )"
            done < <(
              echo "$ATTESTATION_MANIFEST" | jq -r '
                .layers[]
                | select(.mediaType == "application/vnd.in-toto+json")
                | .annotations["in-toto.io/predicate-type"] // empty
              '
            )
          done

          [[ "$FOUND_SBOM" == true ]] || { echo "SPDX SBOM attestation missing." >&2; exit 1; }
          [[ "$FOUND_PROVENANCE" == true ]] || { echo "SLSA provenance attestation missing." >&2; exit 1; }

          jq -n             --arg image "$IMAGE"             --arg digest "$DIGEST"             --arg version "$VERSION"             --arg tag "$RELEASE_TAG"             --arg sourceSha "$SOURCE_SHA"             --arg builtAtUtc "$BUILD_DATE"             --arg validatingCiRunId "$VALIDATING_CI_RUN_ID"             --argjson attestations "$VERIFIED_ATTESTATIONS"             '{image:$image,digest:$digest,version:$version,tag:$tag,sourceSha:$sourceSha,builtAtUtc:$builtAtUtc,validatingCiRunId:$validatingCiRunId,sbom:"SPDX",provenance:"SLSA/BuildKit",attestations:$attestations}'             > release-manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: llmproxy-release-manifest-${{ inputs.source_sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Setup .NET 10 for agent release assets
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Node Agent release assets
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for RID in linux-x64 linux-arm64; do
            STAGE="$(mktemp -d)"
            dotnet publish src/LlmProxy.NodeAgent/LlmProxy.NodeAgent.csproj \
              -c Release -r "$RID" --self-contained true \
              -p:PublishSingleFile=true -p:PublishTrimmed=false \
              -p:Version="$VERSION" \
              -o "$STAGE"
            cp distribution/llmproxy-node-agent.service "$STAGE/"
            cp distribution/node-agent.env.example "$STAGE/"
            cp distribution/install-node-agent.sh "$STAGE/"
            cp distribution/update-node-agent.sh "$STAGE/"
            cp distribution/prepare-node-host.sh "$STAGE/"
            cp -R distribution/airllm-runtime "$STAGE/airllm-runtime"
            chmod 0755 "$STAGE/LlmProxy.NodeAgent" "$STAGE/install-node-agent.sh" "$STAGE/update-node-agent.sh" "$STAGE/prepare-node-host.sh"
            ARCHIVE="dist/llmproxy-node-agent-$VERSION-$RID.tar.gz"
            tar -C "$STAGE" -czf "$ARCHIVE" .
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
            rm -rf "$STAGE"
          done
          sha256sum -c "dist/llmproxy-node-agent-$VERSION-linux-x64.tar.gz.sha256"
          sha256sum -c "dist/llmproxy-node-agent-$VERSION-linux-arm64.tar.gz.sha256"
          cp distribution/connect-node.sh dist/llmproxy-connect-node.sh
          chmod 0755 dist/llmproxy-connect-node.sh
          sha256sum dist/llmproxy-connect-node.sh > dist/llmproxy-connect-node.sh.sha256

      - name: Build Update Agent release binaries
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for RID in linux-x64 linux-arm64; do
            OUT="dist/update-agent/$RID"
            mkdir -p "$OUT"
            dotnet publish src/LlmProxy.UpdateAgent/LlmProxy.UpdateAgent.csproj \
              -c Release -r "$RID" --self-contained true \
              -p:PublishSingleFile=true -p:PublishTrimmed=false \
              -p:Version="$VERSION" \
              -o "$OUT"
            test -x "$OUT/LlmProxy.UpdateAgent"
          done

      - name: Build Linux release assets
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          UPDATE_AGENT_X64_BINARY="$PWD/dist/update-agent/linux-x64/LlmProxy.UpdateAgent" \
          UPDATE_AGENT_ARM64_BINARY="$PWD/dist/update-agent/linux-arm64/LlmProxy.UpdateAgent" \
            bash distribution/build-release-bundle.sh "$VERSION" dist
          (
            cd dist
            sha256sum -c "llmproxy-$VERSION-linux.tar.gz.sha256"
            sha256sum -c llmproxy-bootstrap.sh.sha256
            sha256sum -c llmproxy-update-plan.json.sha256
          )

      - name: Create immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG"             --repo "$GITHUB_REPOSITORY"             --verify-tag             --title "LlmProxy $VERSION"             --generate-notes             "dist/llmproxy-$VERSION-linux.tar.gz"             "dist/llmproxy-$VERSION-linux.tar.gz.sha256"             "dist/llmproxy-bootstrap.sh"             "dist/llmproxy-bootstrap.sh.sha256"             "dist/llmproxy-update-plan.json"             "dist/llmproxy-update-plan.json.sha256"             "dist/llmproxy-node-agent-$VERSION-linux-x64.tar.gz"             "dist/llmproxy-node-agent-$VERSION-linux-x64.tar.gz.sha256"             "dist/llmproxy-node-agent-$VERSION-linux-arm64.tar.gz"             "dist/llmproxy-node-agent-$VERSION-linux-arm64.tar.gz.sha256"             "dist/llmproxy-connect-node.sh"             "dist/llmproxy-connect-node.sh.sha256"             "dist/test.sh"             "dist/test.sh.sha256"             "dist/test.install.sh.gpg"             "dist/test.install.sh.gpg.sha256"             release-manifest.json

          {
            echo "### Immutable release published"
            echo ""
            printf '%s\n' '- Version: `'"$VERSION"'`'
            printf '%s\n' '- Tag: `'"$RELEASE_TAG"'`'
            printf '%s\n' '- Source: `${{ inputs.source_sha }}`'
            printf '%s\n' '- Digest: `${{ steps.build.outputs.digest }}`'
            printf '%s\n' '- Architectures: `linux/amd64`, `linux/arm64`'
            echo "- SBOM: SPDX OCI attestation verified"
            echo "- Provenance: SLSA/BuildKit OCI attestation verified"
          } >> "$GITHUB_STEP_SUMMARY"
