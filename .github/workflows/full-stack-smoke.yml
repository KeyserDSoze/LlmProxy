name: Full stack smoke

on:
  workflow_dispatch:

concurrency:
  group: full-stack-manual-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Redis + OpenTelemetry + Grafana stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run full-stack smoke
        run: bash tests/backend/integration/full_stack_smoke.sh

      - name: Run transactional outbox recovery smoke
        run: bash tests/backend/integration/runtime_outbox_smoke.sh

      - name: Run distributed output-token budget smoke
        run: bash tests/backend/integration/token_budget_redis_smoke.sh

      - name: Run cross-replica credential rotation smoke
        run: bash tests/backend/integration/credential_rotation_smoke.sh

      - name: Run safe node maintenance smoke
        run: bash tests/backend/integration/node_maintenance_smoke.sh

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-diagnostics
          path: |
            /tmp/full-stack-headers.txt
            /tmp/full-stack-chat.json
            /tmp/full-stack-trace.json
            /tmp/full-stack-rate-*.*
            /tmp/full-stack-capacity-*
            /tmp/runtime-outbox-*.*
            /tmp/token-budget-*.*
            /tmp/credential-rotation-*.*
            /tmp/maintenance-*.*
            /tmp/llmproxy-full-stack-mock.log
            /tmp/llmproxy-outbox-mock.log
            /tmp/llmproxy-token-budget-mock.log
            /tmp/llmproxy-rotation-mock.log
            /tmp/llmproxy-maintenance-mock.log
          if-no-files-found: ignore
          retention-days: 7
